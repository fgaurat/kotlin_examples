# Catalogue de versions : QUELLES bibliothèques existent et en QUELLE version.
# Gradle le lit automatiquement (gradle/libs.versions.toml).
# Les coordonnées viennent de la documentation de chaque bibliothèque ou de Maven Central
# (central.sonatype.com) ; vérifier la compatibilité avec la version de Kotlin.

[versions]
kotlin = "2.2.10"
kotlinxSerialization = "1.9.0"   # 1.10+ exige Kotlin 2.3, 1.12 exige Kotlin 2.4
coroutines = "1.10.2"
retrofit = "3.0.0"
okhttp = "4.12.0"                # version utilisée par Retrofit 3.0.0

[libraries]
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Même version que Kotlin : génère le code de (dé)sérialisation des classes @Serializable
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
